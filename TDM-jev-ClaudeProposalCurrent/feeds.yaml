  - {name: Sideburn Magazine,         url: https://sideburnmagazine.com/blog-feed.xml,           kind: article, ownership: independent}
  - {name: OilySmudges,               url: https://oilysmudges.com/feed,                         kind: article, ownership: independent, assign: [custom-vintage]}
  - {name: Surfazz,                   url: https://surfazzblog.blogspot.com/feeds/posts/default, kind: article, ownership: independent, assign: [custom-vintage]}
  - {name: BikeBound,                 url: https://bikebound.tumblr.com/rss,                     kind: article, ownership: independent, assign: [custom-vintage]}
