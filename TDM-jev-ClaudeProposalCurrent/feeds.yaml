# Source registry. First pass built from the Gemini survey; run
#   python dm.py validate
# before trusting any of it. Fields:
#
#   name        display name
#   url         feed URL (or a web page / YouTube @handle: validate will try to discover the feed)
#   kind        article | podcast | video | reddit | forum | classifieds
#               -> sets media type, polling interval and quality gate (see kinds in config.yaml)
#   ownership   independent | commercial | oem | community | advocacy
#               First guess, edit freely. Not used for ranking yet; it's here so
#               "surface the indie sources" has data to work with later.
#   assign      categories applied without asking Jev (single-topic sources, e.g. a motocross mag)
#   gate        true/false: override the kind's quality-gate default
#   lang        ISO code if not English (Jev is less reliable off-English)
#   enabled     false to keep a source listed but not polled

sources:
  # --- Commercial publications ----------------------------------------------
  - {name: Rider Magazine,        url: https://ridermagazine.com/feed,               kind: article, ownership: commercial}
  - {name: webBikeWorld,          url: https://webbikeworld.com/feed,                kind: article, ownership: commercial}
  - {name: RideApart,             url: https://www.rideapart.com/rss/articles/all,   kind: article, ownership: commercial}
  - {name: Cycle World,           url: https://www.cycleworld.com/feed/,             kind: article, ownership: commercial}
  - {name: Motorcycle News (MCN), url: https://www.motorcyclenews.com/rss,           kind: article, ownership: commercial}
  - {name: Motorcycle.com,        url: https://www.motorcycle.com/feed,              kind: article, ownership: commercial}
  - {name: Visordown,             url: https://www.visordown.com/rss,                kind: article, ownership: commercial}
  - {name: Motorcyclist,          url: https://www.motorcyclistonline.com/feed/,     kind: article, ownership: commercial}
  - {name: Motorcycle Mojo,       url: https://motorcyclemojo.com/feed,              kind: article, ownership: independent}
  - {name: Inside Motorcycles,    url: https://www.insidemotorcycles.com/feed,       kind: article, ownership: independent}
  - {name: MCNews Australia,      url: https://mcnews.com.au/feed,                   kind: article, ownership: independent}

  # --- Custom / cafe / vintage -----------------------------------------------
