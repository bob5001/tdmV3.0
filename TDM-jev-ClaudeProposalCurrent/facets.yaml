# Brand and event facets: asked of Jev alongside the categories, stored in each item's scores.
#   brand-<slug>  exists only when an alias matched the title/summary (a MENTION); its score is Jev's answer to
#                 "is the article substantially about this brand?" (the SUBJECT). Racing vs road coverage comes
#                 from the item's own Racing category.
#   event-<slug>  asked for every English item: what happened (launch, recall, deal...).
# Editing this file changes the taxonomy fingerprint: the publisher re-scores all English items once.
