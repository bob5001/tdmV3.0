# Event types: what HAPPENED, as opposed to categories (subject) and forms (kind of piece).
# Wording tested with Jev on 400 live items (2026-10-02); counts in comments are rough keyword hits.
events:
  - slug: launch
    label: Launch / reveal                       # ~128
    instructions: The article reports a new motorcycle model or model year being revealed, launched, or officially
      announced by its maker. Not a review, test or comparison of a model that was already revealed, and not
      racing rider or team news.
  - slug: pricing
    label: Pricing & availability                # ~57
    instructions: The main news in the article is the price, release date, or market availability of a motorcycle or
      product. A review or test that mentions the price, or a classified ad for a single used motorcycle, does not count.
  - slug: recall
    label: Recall / safety action                # ~8
    instructions: The article reports a recall, safety notice, or official defect investigation affecting motorcycles
      or motorcycle products.
  - slug: personnel
    label: Executive move                        # ~11
    instructions: The article reports an executive or senior management appointment, departure, or role change at a
      motorcycle company (not a racing rider or team staff change).
  - slug: results
    label: Sales & financial results             # ~16
    instructions: The article reports sales figures, registrations, market share, revenue, profit, or other financial
      results for a motorcycle company or market.
  - slug: corporate
    label: Deal / investment / partnership       # ~74
    instructions: The article reports an acquisition, merger, investment, stake, joint venture, or business partnership
      involving a motorcycle company. Not racing team sponsorship or rider contracts.
  - slug: operations
    label: Production, plants & jobs             # ~101 (keyword is noisy)
    instructions: The article reports a factory opening or closure, a production change, layoffs, insolvency, or
      restructuring at a motorcycle company.
  - slug: legal
    label: Legal & regulatory                    # ~12
    instructions: The article reports a lawsuit, court ruling, tariff, emissions or noise rule, or other law or
      regulation affecting motorcycles or the motorcycle industry.
  - slug: racing-deal
    label: Rider / team / sponsor deal           # ~139
    instructions: The article reports a racing rider's contract or team move, a team line-up change, or a racing team's
      sponsorship or title-sponsor deal.
  - slug: dealer
    label: Dealer & retail                       # ~46
    instructions: The article reports a motorcycle dealership or retailer opening, closing, changing hands, or changing
      what it sells.
