# MVP category set (working version, tuned against v1 hand tags). Wording is the thing being tuned; config.yaml in TDM-jev-ClaudeProposalCurrent is generated from this.
#
# `v1` lists the v1 WordPress categories whose hand-added tags count as ground truth for each slug.
# Only human-added tags are used (see build_corpus.py). They are positives only: a post without the
# tag might still belong to the category.

# Policy: scooters, mopeds and e-bikes are out of scope for now (off-topic), as are cars and bicycles.
on_topic: >
  The article is about motorcycles, motorcycle riding, motorcycle racing, or the motorcycle
  industry. Cars, bicycles, e-bikes, scooters, mopeds, and snowmobiles are not motorcycles.

categories:
  - slug: electric
    label: Electric
    v1: [electric]
    instructions: The article is about electric motorcycles, electric powertrains, batteries, charging, or electric motorcycle companies.

  - slug: adventure
    label: Adventure
    v1: [adventure]
    instructions: The article is about adventure, dual-sport, or off-pavement touring motorcycles, ADV riding, or overlanding.

  - slug: racing
    label: Racing
    v1: [racing]
    instructions: >
      The article covers competitive motorcycle racing: a race, championship or series, results, rules,
      or the riders and teams in it, including racer interviews and careers (MotoGP, WSBK, TT, dirt track,
      supercross and motocross, and so on). General dirt bike or motocross riding, gear, bike news and
      reviews are not racing unless they cover racing itself.
    children:   # series splits (owner interview 2026-09-25); MX race coverage keeps BOTH racing and dirt-mx via `also`
      - slug: motogp
        label: MotoGP
        instructions: >
          The article is about Grand Prix motorcycle racing at any class level (MotoGP premier class, Moto2, or Moto3), including races, results, riders, teams, calendar, rules, or championship news for those series.
      - slug: worldsbk-superbike
        label: WorldSBK & Superbike
        instructions: >
          The article is about World Superbike (WorldSBK) racing, Supersport/Sportbike World Championship racing, or national Superbike championship racing, including races, results, riders, teams, or championship news for those series.
      - slug: motocross-supercross
        label: Motocross & Supercross
        instructions: >
          The article is about motocross, supercross, SuperMotocross (SMX), or arenacross racing, including races, results, riders, teams, or championship news for those series.
        also: [dirt-mx]

  - slug: dirt-mx
    label: MX & Dirt
    v1: [motocross]
    instructions: >
      The article is about motocross, dirt bikes, enduro, trials, supermoto, or off-road riding: the bikes,
      gear, riders, tracks and culture, including motocross and supercross race coverage.

  - slug: sport-bikes
    label: Sport Bikes
    v1: [sport-bikes]
    instructions: The article is about sport bikes or superbikes, meaning high-performance road-going motorcycles with fairings.

  - slug: cruisers
    label: Cruisers
    v1: [cruisers]
    instructions: >
      The article is about cruiser-style motorcycles: cruisers, baggers, and touring or heritage V-twins
      (Harley-Davidson, Indian, Honda Rebel and Gold Wing, Royal Enfield 650 twins, Triumph Rocket 3,
      and similar), including bikes that sit on the fuzzy edge of the cruiser style.

  - slug: custom
    label: Custom
    v1: [bobbers, scramblers, cafe-racers, choppers, custom]
    instructions: The article features a custom-built motorcycle such as a bobber, cafe racer, scrambler, chopper, or tracker, or the builder or shop behind one.
    children:   # child tags apply only when this parent applies (cutoff thresholds.child); 'also' adds another top-level tag
      - slug: cafe-racers
        label: Cafe Racers
        instructions: >
          The article features a specific custom motorcycle that is unmistakably a cafe racer: a stripped-down retro road bike with low clip-on style bars, a solo or bum-stop seat, and a sporty road-racer look. Roundups, contest coverage, and articles spanning several styles do not count unless this one style clearly dominates.
      - slug: scramblers
        label: Scramblers
        instructions: >
          The article features a specific custom motorcycle that is a scrambler: a retro street bike modified for light off-road use, with high-mounted exhaust, wide bars, and dual-purpose tires. Roundups, contest coverage, and articles spanning several styles do not count unless this one style clearly dominates.
      - slug: bobbers-choppers
        label: Bobbers & Choppers
        instructions: >
          The article features a specific custom motorcycle that is a bobber or chopper: a stripped cruiser-style build with cut-down fenders, a low seat, and a minimalist frame, or extended forks. Roundups, contest coverage, and articles spanning several styles do not count unless this one style clearly dominates.
      - slug: trackers
        label: Trackers
        instructions: >
          The article features a specific custom motorcycle built in the flat-track or tracker style, with number plates, a flat-track stance, and dirt-track inspired bodywork. Roundups, contest coverage, and articles spanning several styles do not count unless this one style clearly dominates.
      - slug: restomods
        label: Restomods
        instructions: >
          The article is about a restomod: a classic or vintage motorcycle rebuilt with modern components such as modern brakes, suspension, fuel injection, electronics, or engine, and the article treats those modern upgrades as the point. A custom that merely started from an old donor bike, or a stock restoration, is not a restomod. Roundups, contest coverage, and articles spanning several styles do not count unless this one style clearly dominates.
        also: [classic]

  - slug: classic
    label: Classic
    v1: [classic-bikes, historical, restoration]
    instructions: The article is about classic or vintage motorcycles, their history, or restoring them.

  # Catch-alls for on-topic articles that are not about one kind of bike. Not evaluated against v1
  # hand tags (v1 had none); judged by how many on-topic posts still end up with no category.
  - slug: gear
    label: Gear
    v1: []
    instructions: The article is about riding gear or accessories, such as helmets, jackets, boots, gloves, luggage, intercoms and other electronics, tires, or tools.

  - slug: new-models
    label: New Models
    v1: []
    instructions: The article announces, unveils, previews, or reviews a new or updated production motorcycle model, including first looks, first rides, and road tests.

  - slug: industry
    label: Industry & Business
    v1: []
    instructions: The article is about motorcycle industry business, such as sales figures, company finances, acquisitions, recalls, regulation, tariffs, sponsorships, dealer news, or executive changes.

  # EXPERIMENT: categories suggested by the orphan cluster analysis
  - slug: events-rides
    label: Events & Rides
    v1: []
    instructions: The article is about a rider-community motorcycle event, rally, charity or themed ride, festival, meetup, organized tour, or a specific ride or route. Professional race coverage, results, and previews are not events for this purpose.

  - slug: law-safety
    label: Law & Safety
    v1: []
    instructions: The article is about rider safety, traffic laws and regulations, licensing, insurance, rider-rights advocacy, or crashes and legal cases involving riders.

  - slug: for-sale
    label: For Sale
    v1: [for-sale]
    instructions: The article is a listing, auction, or classified for a specific motorcycle or part that is for sale, or a buying feature about where and how to find one.

# ---------------------------------------------------------------------------------------------
# FORMS: what sort of piece an article is, independent of its subject (see the form-facet discussion).
# Deliberately generous: tags are cheap, menu space is not. Usage decides what gets demoted later.
# Test for a form: swap the subject and the form survives ("Top 7 X", "Buyer's guide to X").
# multi_subject is a scope flag, not a form: the piece covers several unrelated subjects.
# ---------------------------------------------------------------------------------------------
multi_subject: The article covers several unrelated subjects rather than one, such as a digest, newsletter, roundup, or list of unrelated items.

forms:
  - slug: news
    label: News
    instructions: The article is a straightforward news report about something that just happened or was announced.
  - slug: review
    label: Review
    instructions: The article is a review or road test of a single motorcycle, product, or accessory.
  - slug: comparison-test
    label: Comparison Test
    instructions: The article is a head-to-head or group comparison test of several motorcycles or products.
  - slug: first-look
    label: First Look
    instructions: The article gives first-ride, first-look, or preview impressions of a new model.
  - slug: ranked-list
    label: Ten Best
    instructions: The article is a ranked list or a 'top N' or 'best of' selection.
  - slug: buyers-guide
    label: Buyer's Guide
    instructions: The article helps readers choose or buy a motorcycle or product, including advice on buying used.
  - slug: how-to
    label: How To
    instructions: The article gives instructions for doing or fixing something, or is a maintenance or riding-skill guide.
  - slug: explainer
    label: Explainer
    instructions: The article explains how something works or what something means, in an educational way.
  - slug: opinion
    label: Opinion
    instructions: The article is opinion, commentary, or an essay arguing a viewpoint.
  - slug: profile-interview
    label: Profile & Interview
    instructions: The article is an interview with, or a profile of, a person or a company.
  - slug: tribute
    label: Tribute
    instructions: The article is a tribute, obituary, or remembrance.
  - slug: listing
    label: Listing
    instructions: The article is a listing, auction, or classified for a specific item that is for sale.
  - slug: event-report
    label: Event Report
    instructions: The article reports on a race, rally, show, or other event that has happened, with results or a recap.
  - slug: event-preview
    label: Event Preview
    instructions: The article announces or previews an upcoming event or race weekend.
  - slug: press-release
    label: Announcement
    instructions: The article is a manufacturer or organization announcement, product launch, or press-release rewrite.
  - slug: digest
    label: Digest
    instructions: The article is a newsletter or digest bundling several unrelated items.
  - slug: photo-gallery
    label: Photo Gallery
    instructions: The article is mainly a photo or video gallery with little text.
  - slug: ride-report
    label: Ride Report
    instructions: The article is a first-person account of a ride, trip, or travel story.
  - slug: history
    label: History
    instructions: The article is a history feature about a past bike, event, or person.
  - slug: rumor
    label: Rumor & Spy Shots
    instructions: The article is a rumor, leak, patent filing, or spy shot about an unreleased product.
  - slug: safety-notice
    label: Safety & Rules
    instructions: The article is a recall, safety warning, law change, or regulatory notice.
  - slug: episode
    label: Episode
    instructions: The article is a podcast or video episode.
  - slug: build-feature
    label: Build Feature
    instructions: The article is a feature on one specific custom or restored bike and its builder.
  - slug: q-and-a
    label: Q&A
    instructions: The article is a reader question and answer, or an advice column.
